name: Setup workspace Rust toolchain
description: Install and verify every Rust component and target required by the repository

runs:
  using: composite
  steps:
    - name: Resolve generated Rust toolchain manifest
      id: toolchain
      shell: bash
      run: node "${{ github.action_path }}/resolve-toolchain.mjs"

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
      with:
        toolchain: ${{ steps.toolchain.outputs.toolchain }}
        components: ${{ steps.toolchain.outputs.components }}
        targets: ${{ steps.toolchain.outputs.targets }}

    - name: Verify repository Rust toolchain
      shell: bash
      run: node "$GITHUB_WORKSPACE/tools/quality/quality.mjs" rust-toolchain check
